<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Slideshow</title>
  </head>
  <body>
    <div id="app">
      <div class="slideshow-container">
        
        <!-- Slides -->
        <div class="slide fade">
          <img src="https://filemanager.one.com/api/webspace/2/drive/corneliusschool.be/data/httpd.www/Interne%20LLKpagina/519f564a-3c1f-4f5a-b351-ab02321fa1bf.jpeg" alt="Nieuwe speelplaats" class="slide-img">
          <div class="slide-caption">Tranquil Rivers</div>
        </div>

        <div class="slide fade">
          <img src="https://picsum.photos/id/1016/1200/800" alt="Mountain View" class="slide-img">
          <div class="slide-caption">Majestic Canyons</div>
        </div>

        <div class="slide fade">
          <img src="https://picsum.photos/id/1018/1200/800" alt="Forest Peaks" class="slide-img">
          <div class="slide-caption">Alpine Forests</div>
        </div>

        <div class="slide fade">
          <img src="https://picsum.photos/id/1025/1200/800" alt="Pug in blanket" class="slide-img">
          <div class="slide-caption">Cozy Moments</div>
        </div>

        <!-- Navigation Arrows -->
        <button class="nav-button prev-button" id="prevBtn" aria-label="Previous Slide">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="nav-button next-button" id="nextBtn" aria-label="Next Slide">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>

        <!-- Indicators -->
        <div class="dots-container" id="dotsContainer">
          <!-- Dots will be generated by JS -->
        </div>

      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
